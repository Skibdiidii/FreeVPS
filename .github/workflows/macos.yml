name: MacOS Virtual Machine

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    name: MacOS Build
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tailscale
        run: |
          brew install --quiet tailscale
          sudo brew services start tailscale

          echo "Waiting for Tailscale..."
          for i in {1..30}; do
            if tailscale version >/dev/null 2>&1; then
              echo "Tailscale is ready."
              break
            fi
            sleep 2
          done

      - name: Connect Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          sudo tailscale up \
            --authkey="$TAILSCALE_AUTHKEY" \
            --accept-dns=false

          echo "=========================================="
          echo "TAILSCALE CONNECTED"
          echo "=========================================="

          tailscale ip -4
          echo ""
          tailscale status

      - name: Setting Up the MacOS Environment
        env:
          MAC_USER_PASSWORD: ${{ secrets.MAC_USER_PASSWORD }}
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
          MAC_REALNAME: ${{ secrets.MAC_REALNAME }}
        run: |
          source macos-run.sh "$MAC_USER_PASSWORD" "$VNC_PASSWORD" "$MAC_REALNAME"

      - name: Activate Mac GUI
        run: |
          echo "Activating graphical session..."
          caffeinate -dimsu &
          
          echo "Console user:"
          stat -f "%Su" /dev/console || true

          echo "Launching Safari..."
          open -a Safari https://www.roblox.com || true

          echo "Restarting Screen Sharing..."
          sudo launchctl kickstart -k system/com.apple.screensharing || true

          sleep 10

      - name: Diagnose macOS GUI
        run: |
          echo "=== CONSOLE USER ==="
          stat -f "%Su" /dev/console || true

          echo "=== USERS ==="
          who || true

          echo "=== DISPLAY ==="
          echo "DISPLAY=$DISPLAY"
          echo "HOME=$HOME"
          echo "USER=$USER"

          echo "=== GRAPHICAL SESSION ==="
          launchctl print system/com.apple.loginwindow 2>&1 | head -40 || true

          echo "=== SCREENSHARING ==="
          sudo launchctl print system/com.apple.screensharing 2>&1 | head -40 || true

          echo "=== DISPLAY INFO ==="
          system_profiler SPDisplaysDataType 2>&1 || true

          echo "=== TEST SCREEN ==="
          screencapture -x /tmp/test-screen.png 2>&1 || true
          ls -lh /tmp/test-screen.png 2>&1 || true

      - name: Verify VNC
        run: |
          echo "Testing VNC..."
          nc -vz 127.0.0.1 5900

          echo ""
          echo "Tailscale IPv4:"
          tailscale ip -4

          echo ""
          echo "=========================================="
          echo "VNC CONNECTION"
          echo "=========================================="
          echo "Address: $(tailscale ip -4):5900"
          echo "Username: koolisw"
          echo "=========================================="

      - name: Keep MacOS Running
        run: |
          echo "MacOS + VNC + Tailscale are running."
          sleep 6h
