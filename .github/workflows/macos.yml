name: MacOS Virtual Machine

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    name: MacOS Build
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tailscale
        run: |
          brew install --quiet tailscale
          sudo brew services start tailscale

          echo "Waiting for Tailscale..."
          for i in {1..30}; do
            if tailscale version >/dev/null 2>&1; then
              echo "Tailscale is ready."
              break
            fi
            sleep 2
          done

      - name: Connect Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          sudo tailscale up \
            --authkey="$TAILSCALE_AUTHKEY" \
            --accept-dns=false

          echo "=========================================="
          echo "TAILSCALE CONNECTED"
          echo "=========================================="

          tailscale ip -4
          echo ""
          tailscale status

      - name: Setting Up the MacOS Environment
        env:
          MAC_USER_PASSWORD: ${{ secrets.MAC_USER_PASSWORD }}
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
          MAC_REALNAME: ${{ secrets.MAC_REALNAME }}
        run: |
          source macos-run.sh "$MAC_USER_PASSWORD" "$VNC_PASSWORD" "$MAC_REALNAME"

      - name: Verify VNC
        run: |
          echo "Testing VNC..."
          nc -vz 127.0.0.1 5900

          echo ""
          echo "Tailscale IPv4:"
          tailscale ip -4

          echo ""
          echo "=========================================="
          echo "VNC CONNECTION"
          echo "=========================================="
          echo "Address: $(tailscale ip -4):5900"
          echo "Username: koolisw"
          echo "=========================================="

      - name: Keep MacOS Running
        run: |
          echo "MacOS + VNC + Tailscale are running."
          sleep 6h
